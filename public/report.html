<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why this grade? · Web CO₂ Report Card</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; }
    body.dark { background: #1a1a1a; color: #e5e5e5; --card: #262626; --line: #333; --muted: #a3a3a3; }
    body.light { background: #f9fafb; color: #1f2937; --card: #ffffff; --line: #e5e7eb; --muted: #6b7280; }
    #root { max-width: 760px; margin: 0 auto; padding: 40px 24px 64px; }
    .muted { color: var(--muted); }
    .top { display: flex; gap: 20px; align-items: flex-start; }
    .grade { flex: 0 0 72px; height: 72px; border-radius: 14px; color: #fff; font-size: 2rem; font-weight: 700;
             display: flex; align-items: center; justify-content: center; }
    .eyebrow { text-transform: uppercase; letter-spacing: .06em; font-size: .75rem; color: var(--muted); }
    h1 { margin: 2px 0 6px; font-size: 1.5rem; word-break: break-all; }
    h1 .path { font-weight: 400; color: var(--muted); font-size: 1rem; margin-left: 4px; }
    .lede { margin: 0 0 6px; }
    h2 { font-size: 1rem; margin: 36px 0 12px; }
    .whatif { margin-top: 24px; padding: 14px 18px; border-radius: 12px; background: var(--card);
              border-left: 4px solid #10b981; }
    .bar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; gap: 2px; }
    .seg { flex-basis: 0; min-width: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    td, th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    .num { text-align: right; white-space: nowrap; }
    .legend { margin-top: 12px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; }
    .split { display: flex; gap: 12px; margin-top: 14px; }
    .split > div { flex: 1; background: var(--card); border-radius: 10px; padding: 10px 14px; }
    .split span { display: block; font-size: .8rem; }
    .split b { margin-right: 6px; }
    .check { background: var(--card); border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; }
    .check-head { display: flex; align-items: center; gap: 10px; }
    .check h3 { margin: 0; font-size: 1rem; flex: 1; }
    .check p { margin: 8px 0 0; }
    .check .advice { color: var(--muted); font-size: .9rem; }
    .status { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
              font-weight: 700; font-size: .8rem; color: #fff; }
    .issue .status { background: #ea580c; }
    .pass .status { background: #10b981; }
    .pass p { color: var(--muted); }
    .pill { font-size: .75rem; font-weight: 600; background: #10b98122; color: #10b981; padding: 2px 8px; border-radius: 999px; }
    .files { margin-top: 10px; }
    .fname a { color: inherit; text-decoration: none; font-weight: 500; }
    .fname a:hover { text-decoration: underline; }
    .fhost { display: block; font-size: .75rem; color: var(--muted); }
    .save { color: #10b981; }
    footer { margin-top: 40px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div id="root"><p class="muted">Analyzing this page…</p></div>
</body>
</html>
